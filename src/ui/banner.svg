<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0814"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="1197" height="417" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2"/>

  <!-- Header Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="360" height="28" rx="14" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#c084fc" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AUTONOMOUS SPEC-DRIVEN DEVLOOP</text>
  </g>

  <!-- Main Logo SVG Icon -->
  <g transform="translate(60, 100)">
    <rect width="72" height="72" rx="14" fill="#000000" stroke="#a855f7" stroke-width="3"/>
    <path d="M16 14 H30 V36 H16 Z" fill="#A855F7"/>
    <path d="M56 14 H42 V27 H56 Z" fill="#C084FC"/>
    <path d="M42 34 H56 V58 H42 Z" fill="#A855F7"/>
    <path d="M16 44 H30 V58 H16 Z" fill="#7E22CE"/>
    <circle cx="36" cy="36" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Main Title -->
  <g transform="translate(150, 105)">
    <text x="0" y="44" fill="#ffffff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Kane<tspan fill="url(#purpleGlow)">Flow</tspan></text>
    <text x="0" y="68" fill="#9da2b3" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="500">The Closed-Loop Self-Healing Engine Powered by Kane CLI</text>
  </g>

  <!-- Value Proposition Line -->
  <g transform="translate(60, 215)">
    <text x="0" y="0" fill="#e2e8f0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="600">
      Plain-English Specs <tspan fill="#a855f7">→</tspan> Browser Automation <tspan fill="#a855f7">→</tspan> Telemetry <tspan fill="#a855f7">→</tspan> Agent Code Repair <tspan fill="#10b981">→</tspan> Green Verification
    </text>
  </g>

  <!-- Flow Visual Cards -->
  <g transform="translate(60, 255)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="90" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="18" y="28" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">01 / SPEC VERIFICATION</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Kane CLI Automation</text>
      <text x="18" y="72" fill="#6e7180" font-family="'Segoe UI', sans-serif" font-size="11">Real Chromium DOM Testing</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(275, 0)">
      <rect width="250" height="90" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="18" y="28" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">02 / FAILURE DIAGNOSIS</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">NDJSON & AST Extraction</text>
      <text x="18" y="72" fill="#6e7180" font-family="'Segoe UI', sans-serif" font-size="11">Root Cause AST Analysis</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 0)">
      <rect width="250" height="90" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="18" y="28" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">03 / CODE SYNTHESIS</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Multi-Model AI Healer</text>
      <text x="18" y="72" fill="#6e7180" font-family="'Segoe UI', sans-serif" font-size="11">Gemini • Claude • GPT-4o • AST</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 0)">
      <rect width="250" height="90" rx="6" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
      <text x="18" y="28" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">04 / SEALED PROOF</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">100% Green Re-Run</text>
      <text x="18" y="72" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11">Verified Evidence Sealed ✓</text>
    </g>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(60, 385)">
    <text x="0" y="0" fill="#6e7180" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">Autonomous Spec-Driven DevLoop • Universal Real-World App &amp; Multi-Model AI Engine</text>
  </g>
</svg>
